services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-todo-app
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
    volumes:
      - ./database:/var/www/html/database
    restart: unless-stopped
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
